# kshark Helm values
#
# Deployed as a CronJob that runs a diagnostic probe on schedule.
# For ad-hoc probes, create a Job from the same image:
#   kubectl create job kshark-probe-$(date +%s) --from=cronjob/kshark

image:
  # No container image is published. Build one from the Dockerfile in
  # this repository, push it to a registry your cluster can pull from,
  # and set image.repository and image.tag to match.
  repository: kshark
  tag: "1.1.1"
  pullPolicy: IfNotPresent

# Where kshark reports are written. kshark writes to reports/ under its
# working directory, so the PVC is mounted at /app/reports.
# Change storageClass for cloud storage (e.g. "gp3" on EKS).
persistence:
  enabled: true
  storageClass: ""
  size: 1Gi

schedule:
  # Default: every hour, at minute 0.
  cron: "0 * * * *"
  # Suspend the schedule (useful for local dev).
  suspend: false
  # How many completed + failed pods to keep for inspection.
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

# Probe configuration. `args` is passed to the kshark binary directly.
# The default --help run only proves the image starts. For a real probe,
# mount a client.properties file and pass for example:
#   args: ["-props", "/config/client.properties", "-y", "-json", "latest.json"]
probe:
  args: ["--help"]

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Pod security. The Dockerfile runs kshark as UID and GID 65532 (appuser).
# These settings are compatible with the Kubernetes "restricted" Pod
# Security Standard. `securityContext` is the container-level block.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: true
  seccompProfile:
    type: RuntimeDefault

serviceAccount:
  create: true
  name: ""        # defaulted from release name
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}

labels:
  app.kubernetes.io/part-of: ops-foundation
