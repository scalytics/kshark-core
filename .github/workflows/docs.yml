name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - '.github/actions/pages/**'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/workflows/docs.yml'
      - '.github/actions/pages/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Docs (Linux)
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$REF"
          git checkout --detach FETCH_HEAD

      - name: Copy root docs into the Jekyll includes
        run: |
          mkdir -p docs/_includes
          cp CHANGELOG.md docs/_includes/CHANGELOG.md
          cp CONTRIBUTING.md docs/_includes/CONTRIBUTING.md

      - name: Build with Jekyll
        env:
          JEKYLL_ENV: production
        run: |
          docker run --rm -e JEKYLL_ENV -v "$PWD:/site" -w /site ruby:3.3-bookworm bash -ec '
            gem install bundler --no-document
            export BUNDLE_GEMFILE=/site/docs/Gemfile
            bundle install
            bundle exec jekyll build --source docs --destination _site
          '
          test -s _site/index.html
          tar --dereference --hard-dereference --directory _site -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Install local Pages action dependencies
        run: npm ci --ignore-scripts --prefix .github/actions/pages

      - name: Test local Pages action
        run: node --test .github/actions/pages/index.test.mjs

      - name: Upload artifact
        id: upload
        uses: ./.github/actions/pages
        with:
          mode: upload

  deploy:
    name: Deploy Docs (Linux)
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$REF"
          git checkout --detach FETCH_HEAD

      - name: Install local Pages action dependencies
        run: npm ci --ignore-scripts --prefix .github/actions/pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.github/actions/pages
        with:
          mode: deploy
          artifact-id: ${{ needs.build.outputs.artifact-id }}
          token: ${{ github.token }}
