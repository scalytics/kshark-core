name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: go1.26.10
    steps:
      # The organization permits local actions only. Keep PR checks executable
      # without external actions, and never schedule paid macOS runners.
      - name: Checkout
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" fetch --depth=1 origin "$REF"
          git checkout --detach FETCH_HEAD

      - name: Set up Go
        run: go version

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.9.0
          "$(go env GOPATH)/bin/golangci-lint" run ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o kshark ./cmd/kshark

      - name: Test
        run: go test ./... -v -race -timeout 120s -coverprofile=coverage.out

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Coverage gate
        run: |
          TOTAL=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print substr($3, 1, length($3)-1)}')
          echo "Total coverage: ${TOTAL}%"
          THRESHOLD=40
          if [ "$(echo "$TOTAL < $THRESHOLD" | bc)" -eq 1 ]; then
            echo "::error::Coverage ${TOTAL}% is below ${THRESHOLD}% minimum"
            exit 1
          fi

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
