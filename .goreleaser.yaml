# .goreleaser.yaml
#
# Build configuration for GoReleaser.
# See https://goreleaser.com/customization/ for more options.

version: 2

project_name: kshark

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: kshark
    main: ./cmd/kshark
    binary: kshark
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - client.properties.example
      - ai_config.json.example
      - web/templates/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# SBOM generation -- produces CycloneDX for each archive
sboms:
  - artifacts: archive
    args: ["${artifact}", "--output", "cyclonedx-json=${document}"]
    documents:
      - "{{ .ArtifactName }}.sbom.cdx.json"

# Cosign signing -- keyless via GitHub OIDC (Sigstore)
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"

homebrew_casks:
  - name: kshark
    repository:
      owner: scalytics
      name: homebrew-tap
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if not (index .Env "HOMEBREW_TAP_GITHUB_TOKEN") }}true{{ end }}'
    homepage: "https://github.com/scalytics/kshark-core"
    description: "Kafka connectivity diagnostic tool — layered probe from DNS to produce/consume"
    license: "Apache-2.0"
    binaries: [kshark]

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  name_template: "kshark v{{.Version}}"
  prerelease: auto
  header: |
    ## kshark v{{.Version}}

    Cross-platform Kafka connectivity diagnostic tool.

    ### Verification

    ```bash
    # Verify checksum signature (requires cosign)
    cosign verify-blob \
      --bundle checksums.txt.sigstore.json \
      --certificate-identity-regexp='https://github.com/scalytics/kshark-core' \
      --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
      checksums.txt

    # Verify file integrity
    sha256sum -c checksums.txt
    ```
  footer: |
    ---
    **Full Changelog**: https://github.com/scalytics/kshark-core/compare/{{ .PreviousTag }}...{{ .Tag }}
