# .goreleaser.yaml
#
# Build configuration for GoReleaser.
# See https://goreleaser.com/customization/ for more options.

project_name: kshark

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: kshark
    main: ./cmd/kshark
    binary: kshark
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE
      - README.md
      - client.properties.example
      - ai_config.json.example
      - web/templates/**/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# SBOM generation -- produces CycloneDX and SPDX for each archive
sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.cdx.json"

# Cosign signing -- keyless via GitHub OIDC (Sigstore)
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    args:
      - sign-blob
      - "--yes"
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"

snapshot:
  name_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'

release:
  name_template: "kshark v{{.Version}}"
  prerelease: auto
  header: |
    ## kshark v{{.Version}}

    Cross-platform Kafka connectivity diagnostic tool.

    ### Verification

    ```bash
    # Verify checksum signature (requires cosign)
    cosign verify-blob \
      --certificate checksums.txt.pem \
      --signature checksums.txt.sig \
      --certificate-identity-regexp='https://github.com/scalytics/kshark-core' \
      --certificate-oidc-issuer='https://token.actions.githubusercontent.com' \
      checksums.txt

    # Verify file integrity
    sha256sum -c checksums.txt
    ```
  footer: |
    ---
    **Full Changelog**: https://github.com/scalytics/kshark-core/compare/{{ .PreviousTag }}...{{ .Tag }}
